name: Temporary MzansiChat six-page preview QA
on:
  push:
    branches:
      - feat/social-preview-navigation-seo-20261020
jobs:
  preview-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tester
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test all six pages on desktop and mobile
        run: node qa-preview.mjs
      - name: Preserve QA results and homepage screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mzansichat-preview-qa
          path: qa-output/
          if-no-files-found: warn
